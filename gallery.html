<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery — Bronx Luggage</title>
  <meta name="description" content="Browse the Bronx Luggage gallery of luggage, bags, backpacks and travel accessories.">
  <link rel="icon" type="image/svg+xml" href="images/logo/favicon.svg">
  <link rel="alternate icon" type="image/png" href="images/logo/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Jost:wght@300;500&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/gallery.css" rel="stylesheet">
</head>
<body data-page="gallery">
  <div id="loader" class="loader"></div>
  <header id="site-header" class="site-header"></header>

  <main id="main">
    <section class="page-hero">
      <div class="container-xl">
        <ol class="breadcrumb-bl rise"><li><a href="index.html">Home</a></li><li aria-current="page">Gallery</li></ol>
        <h1 class="display-title rise d1">The <span class="serif">Gallery.</span></h1>
        <p class="lead-text rise d2">A closer look at the pieces, colours and craftsmanship you’ll find in store.</p>
        <div class="chip-row justify-content-center mt-4 rise d3" id="galleryFilters" role="group" aria-label="Filter gallery">
          <button type="button" class="chip active" data-filter="all">All</button>
          <button type="button" class="chip" data-filter="luggage">Luggage</button>
          <button type="button" class="chip" data-filter="bags">Bags</button>
          <button type="button" class="chip" data-filter="backpacks">Backpacks</button>
          <button type="button" class="chip" data-filter="store">Accessories</button>
        </div>
      </div>
    </section>

    <section class="section-sm pt-0">
      <div class="container-xl">
        <div class="masonry" id="galleryGrid"></div>
      </div>
    </section>

    <!-- lightbox -->
    <div class="modal fade lightbox" id="lightbox" tabindex="-1" aria-labelledby="lbTitle" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-xl">
        <div class="modal-content">
          <button type="button" class="lb-close" data-bs-dismiss="modal" aria-label="Close"><i class="bi bi-x-lg"></i></button>
          <div class="lb-stage" id="lbStage">
            <button type="button" class="lb-nav lb-prev" id="lbPrev" aria-label="Previous image"><i class="bi bi-chevron-left"></i></button>
            <img id="lbImg" alt="">
            <button type="button" class="lb-nav lb-next" id="lbNext" aria-label="Next image"><i class="bi bi-chevron-right"></i></button>
          </div>
          <div class="lb-caption">
            <h2 id="lbTitle"></h2>
            <span id="lbCount"></span>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer id="site-footer" class="site-footer"></footer>
  <div id="ticker" class="ticker"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/art.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/main.js"></script>
  <script src="js/products.js"></script>
  <script src="js/gallery.js"></script>
</body>
</html>
