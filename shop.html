<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop — Bronx Luggage</title>
  <meta name="description" content="Shop luggage, bags, backpacks, briefcases and travel accessories. Filter by size, colour, price and brand.">
  <link rel="icon" type="image/svg+xml" href="images/logo/favicon.svg">
  <link rel="alternate icon" type="image/png" href="images/logo/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Jost:wght@300;500&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/shop.css" rel="stylesheet">
</head>
<body data-page="shop">
  <div id="loader" class="loader"></div>
  <header id="site-header" class="site-header"></header>

  <main id="main">
    <section class="shop-hero">
      <div class="container-xl">
        <ol class="breadcrumb-bl rise"><li><a href="index.html">Home</a></li><li aria-current="page">Shop</li></ol>
        <h1 class="display-title rise d1" id="shopTitle">All products</h1>
        <p class="lead-text rise d2" id="shopLead">Luggage, bags, backpacks and more from five of the world’s most celebrated houses.</p>
      </div>
    </section>

    <!-- category navigation -->
    <nav class="cat-tabs-wrap" aria-label="Product categories">
      <div class="container-xl">
        <div class="cat-tabs" id="catTabs" role="tablist"></div>
      </div>
    </nav>

    <section class="section-sm">
      <div class="container-xl">
        <div class="row g-4 g-xl-5">

          <!-- filters -->
          <div class="col-lg-3">
            <aside class="offcanvas-lg offcanvas-start filters" tabindex="-1" id="filtersPanel" aria-labelledby="filtersTitle">
              <div class="offcanvas-header">
                <h2 class="offcanvas-title" id="filtersTitle">Filters</h2>
                <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#filtersPanel" aria-label="Close filters"></button>
              </div>
              <div class="offcanvas-body">
                <form id="filterForm" class="w-100" autocomplete="off">
                  <div class="filter-block">
                    <label for="fSearch" class="filter-title">Search</label>
                    <div class="search-box">
                      <i class="bi bi-search"></i>
                      <input type="search" id="fSearch" class="form-control" placeholder="Name, brand or type">
                    </div>
                  </div>

                  <div class="filter-block">
                    <p class="filter-title">Shop for</p>
                    <div class="seg" id="fGender">
                      <input type="radio" class="btn-check" name="gender" id="gAll" value="all" checked><label for="gAll">All</label>
                      <input type="radio" class="btn-check" name="gender" id="gMen" value="men"><label for="gMen">Men</label>
                      <input type="radio" class="btn-check" name="gender" id="gWomen" value="women"><label for="gWomen">Women</label>
                    </div>
                  </div>

                  <div class="filter-block">
                    <p class="filter-title">Brand</p>
                    <div id="fBrands" class="check-list"></div>
                  </div>

                  <div class="filter-block">
                    <p class="filter-title">Size</p>
                    <div id="fSizes" class="toggle-row"></div>
                  </div>

                  <div class="filter-block">
                    <p class="filter-title">Colour <span class="filter-hint" id="colorHint"></span></p>
                    <div id="fColors" class="swatch-row"></div>
                  </div>

                  <div class="filter-block">
                    <p class="filter-title">Price</p>
                    <div id="fPrices" class="check-list"></div>
                  </div>

                  <button type="button" class="btn btn-bl-outline w-100" id="clearFilters"><i class="bi bi-arrow-counterclockwise"></i> Clear all filters</button>
                </form>
              </div>
            </aside>
          </div>

          <!-- results -->
          <div class="col-lg-9">
            <div class="results-bar">
              <div class="d-flex align-items-center gap-2">
                <button class="btn btn-bl-outline btn-filter d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#filtersPanel" aria-controls="filtersPanel">
                  <i class="bi bi-sliders"></i> Filters <span class="filter-count" id="filterCount"></span>
                </button>
                <p class="results-count" id="resultsCount" aria-live="polite"></p>
              </div>
              <label class="d-flex align-items-center gap-2 mb-0">
                <span class="sort-label">Sort by</span>
                <select class="form-select form-select-bl" id="sortSelect">
                  <option value="featured">Featured</option>
                  <option value="new">Newest</option>
                  <option value="price-asc">Price: Low to High</option>
                  <option value="price-desc">Price: High to Low</option>
                  <option value="rating">Top rated</option>
                  <option value="name">Name A–Z</option>
                </select>
              </label>
            </div>
            <div class="active-filters" id="activeFilters"></div>
            <div class="product-grid" id="productGrid"></div>
          </div>

        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer" class="site-footer"></footer>
  <div id="ticker" class="ticker"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/art.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/main.js"></script>
  <script src="js/products.js"></script>
  <script src="js/shop.js"></script>
</body>
</html>
